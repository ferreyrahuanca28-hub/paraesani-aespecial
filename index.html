
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#f7c948"
    >

    <title>Para ti... 🌻</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --amarillo: #ffd54f;
            --amarillo-fuerte: #ffc107;

            --vino1: #3b0613;
            --vino2: #65091e;
            --vino3: #930f30;
            --vino4: #b71943;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;

            width: 100%;
            min-height: 100%;

            overflow: hidden;
        }

        body {
            min-height: 100dvh;

            position: relative;

            font-family:
                'Fredoka',
                sans-serif;

            background-color: #111;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }


        /* =======================================
           FONDO
        ======================================= */

        .fondo-zoom {
            position: fixed;

            inset: -25px;

            z-index: -10;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.13),
                    rgba(0, 0, 0, 0.42)
                ),
                url('img/fondo8.png')
                center center /
                cover
                no-repeat;

            transform: scale(1.15);

            transition:
                transform 8s ease,
                filter 2s ease;
        }

        body.escena-activa .fondo-zoom {
            transform: scale(1);
        }


        /* =======================================
           VIÑETA
        ======================================= */

        .ambiente {
            position: fixed;

            inset: 0;

            z-index: -5;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.10) 55%,
                    rgba(0, 0, 0, 0.48) 100%
                );
        }


        /* =======================================
           RESPLANDOR CENTRAL
        ======================================= */

        .luz-central {
            position: fixed;

            top: 50%;
            left: 50%;

            width: 700px;
            height: 700px;

            transform:
                translate(-50%, -50%)
                scale(.75);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 213, 79, .28),
                    rgba(255, 193, 7, .10) 40%,
                    transparent 70%
                );

            opacity: 0;

            filter: blur(25px);

            pointer-events: none;

            z-index: 0;

            transition:
                opacity 2s ease,
                transform 3s ease;
        }

        body.escena-activa
        .luz-central {

            opacity: 1;

            transform:
                translate(-50%, -50%)
                scale(1);
        }


        /* =======================================
           CORTINAS
        ======================================= */

        .escenario-cortinas {
            position: fixed;

            inset: 0;

            z-index: 9998;

            pointer-events: none;

            perspective: 1500px;
        }

        .cortina {
            position: absolute;

            top: 0;

            width: 51%;
            height: 100%;

            overflow: hidden;

            transition:
                transform 2.8s
                cubic-bezier(.65, 0, .15, 1);
        }

        .cortina::before {
            content: "";

            position: absolute;

            inset: 0;

            background:

                linear-gradient(
                    90deg,
                    rgba(0,0,0,.50) 0%,
                    rgba(255,255,255,.05) 8%,
                    rgba(0,0,0,.30) 17%,
                    rgba(255,255,255,.07) 26%,
                    rgba(0,0,0,.43) 37%,
                    rgba(255,255,255,.04) 49%,
                    rgba(0,0,0,.38) 60%,
                    rgba(255,255,255,.07) 73%,
                    rgba(0,0,0,.48) 86%,
                    rgba(255,255,255,.03) 100%
                ),

                linear-gradient(
                    90deg,
                    var(--vino1),
                    var(--vino3),
                    var(--vino4),
                    var(--vino2),
                    var(--vino1)
                );

            background-size:
                120px 100%,
                100% 100%;

            box-shadow:
                inset 0 0 90px
                rgba(0,0,0,.78);

            animation:
                respirarTela
                4s ease-in-out
                infinite;
        }

        .cortina::after {
            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                linear-gradient(
                    180deg,
                    rgba(255,255,255,.08),
                    transparent 20%,
                    transparent 75%,
                    rgba(0,0,0,.30)
                );
        }

        @keyframes respirarTela {

            0%,
            100% {
                filter:
                    brightness(.90);
            }

            50% {
                filter:
                    brightness(1.08);
            }
        }

        .cortina-izquierda {
            left: 0;

            transform-origin:
                left center;

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    97% 50%,
                    100% 100%,
                    0 100%
                );
        }

        .cortina-derecha {
            right: 0;

            transform-origin:
                right center;

            clip-path:
                polygon(
                    0 0,
                    100% 0,
                    100% 100%,
                    0 100%,
                    3% 50%
                );
        }

        body.abrir
        .cortina-izquierda {

            transform:
                translateX(-103%)
                rotateY(20deg);
        }

        body.abrir
        .cortina-derecha {

            transform:
                translateX(103%)
                rotateY(-20deg);
        }


        /* =======================================
           CENEFA SUPERIOR
        ======================================= */

        .cenefa {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 72px;

            z-index: 9999;

            background:
                repeating-linear-gradient(
                    90deg,
                    #480615 0,
                    #8f1230 65px,
                    #4a0616 130px
                );

            box-shadow:
                0 8px 22px
                rgba(0,0,0,.58);

            transition:
                transform 1.8s ease 1.1s;
        }

        .cenefa::after {
            content: "";

            position: absolute;

            bottom: -18px;

            width: 100%;
            height: 20px;

            background:
                radial-gradient(
                    circle at 10px 0,
                    #730b27 10px,
                    transparent 11px
                );

            background-size:
                20px 20px;
        }

        body.abrir
        .cenefa {

            transform:
                translateY(-125%);
        }


        /* =======================================
           PANTALLA INICIAL
        ======================================= */

        .overlay-inicio {
            position: fixed;

            inset: 0;

            z-index: 10000;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 20px;

            transition:
                opacity .7s ease,
                visibility .7s ease;
        }

        body.abrir
        .overlay-inicio {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }

        .tarjeta-inicio {
            width: 100%;
            max-width: 385px;

            padding:
                34px
                28px;

            border-radius: 28px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.98),
                    rgba(255,249,230,.96)
                );

            border:
                1px solid
                rgba(255,255,255,.85);

            box-shadow:
                0 30px 85px
                rgba(0,0,0,.50);

            animation:
                entradaTarjeta
                1.2s
                cubic-bezier(.34,1.56,.64,1);
        }

        @keyframes entradaTarjeta {

            from {
                opacity: 0;

                transform:
                    scale(.72)
                    translateY(45px);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }

        .flor-inicio {
            display: inline-block;

            margin-bottom: 10px;

            font-size: 3.3rem;

            animation:
                florFlota
                2.7s
                ease-in-out
                infinite;
        }

        @keyframes florFlota {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-5deg);
            }

            50% {
                transform:
                    translateY(-10px)
                    rotate(5deg);
            }
        }

        .titulo-inicio {
            margin-bottom: 12px;

            font-family:
                'Pacifico',
                cursive;

            color: #d81b60;
        }

        .texto-inicio {
            margin-bottom: 25px;

            color: #777;

            line-height: 1.6;
        }

        .btn-abrir {
            border: none;

            padding:
                11px
                20px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #ffe477,
                    #ffc107
                );

            color: #5d4037;

            font-weight: 600;

            box-shadow:
                0 9px 22px
                rgba(255,193,7,.3);

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }

        .btn-abrir:hover {

            transform:
                translateY(-3px)
                scale(1.02);

            box-shadow:
                0 13px 28px
                rgba(255,193,7,.4);
        }


        /* =======================================
           CONTENIDO PRINCIPAL
        ======================================= */

        main {
            position: relative;

            z-index: 10;

            min-height: 100dvh;

            display: flex;

            align-items: center;
            justify-content: center;

            padding:
                20px
                15px;
        }

        .contenido-principal {
            width: 100%;

            max-width: 550px;

            text-align: center;
        }


        /* =======================================
           ENTRADAS ESCALONADAS
        ======================================= */

        .animar {
            opacity: 0;

            transform:
                translateY(35px)
                scale(.96);

            filter:
                blur(5px);
        }

        body.escena-activa
        .animar {

            animation:
                aparecerElemento
                1.1s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        @keyframes aparecerElemento {

            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(.96);

                filter:
                    blur(5px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter:
                    blur(0);
            }
        }

        .delay-1 {
            animation-delay:
                .3s !important;
        }

        .delay-2 {
            animation-delay:
                .8s !important;
        }

        .delay-3 {
            animation-delay:
                1.45s !important;
        }

        .delay-4 {
            animation-delay:
                1.95s !important;
        }

        .delay-5 {
            animation-delay:
                2.45s !important;
        }


        /* =======================================
           INSIGNIA
        ======================================= */

        .insignia-fecha {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            max-width: 100%;

            padding:
                10px
                19px;

            border-radius: 50px;

            background:
                rgba(255,213,79,.92);

            color: #5d4037;

            border:
                1px solid
                rgba(255,255,255,.7);

            font-size: .75rem;

            font-weight: 600;

            letter-spacing: 1px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.25);

            backdrop-filter:
                blur(8px);
        }


        /* =======================================
           VIDEO
        ======================================= */

        .video-contenedor {
            position: relative;

            width:
                min(
                    285px,
                    75vw
                );

            margin:
                18px auto
                24px;

            padding: 6px;

            border-radius: 29px;

            overflow: visible;

            background:
                linear-gradient(
                    140deg,
                    #fff8d4,
                    #ffd54f,
                    #ffffff,
                    #ffc107
                );

            box-shadow:
                0 20px 50px
                rgba(0,0,0,.40);
        }

        .video-contenedor::before {
            content: "";

            position: absolute;

            inset: -24px;

            z-index: -2;

            border-radius: 45px;

            background:
                radial-gradient(
                    circle,
                    rgba(255,213,79,.35),
                    transparent 68%
                );

            filter: blur(15px);

            animation:
                brilloVideo
                3s
                ease-in-out
                infinite;
        }

        @keyframes brilloVideo {

            0%,
            100% {
                opacity: .45;

                transform:
                    scale(.95);
            }

            50% {
                opacity: 1;

                transform:
                    scale(1.06);
            }
        }

        .video-principal {
            position: relative;

            z-index: 1;

            width: 100%;

            aspect-ratio: 4 / 5;

            display: block;

            object-fit: cover;

            border-radius: 22px;
        }


        /* =======================================
           CORAZÓN DIBUJÁNDOSE
        ======================================= */

        .corazon-svg {
            position: absolute;

            inset: -44px;

            z-index: 3;

            pointer-events: none;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .corazon-linea {
            width: 128%;
            height: 128%;

            overflow: visible;

            transform:
                rotate(-4deg);

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255, 214, 102, .40)
                );
        }

        .corazon-trazo {
            fill: none;

            stroke:
                rgba(255, 220, 110, .96);

            stroke-width: 3.2;

            stroke-linecap: round;
            stroke-linejoin: round;

            stroke-dasharray: 520;
            stroke-dashoffset: 520;

            opacity: 0;
        }

        body.escena-activa
        .corazon-trazo {

            animation:
                dibujarCorazon
                2.5s ease
                1.8s forwards,

                brilloCorazon
                2.6s ease-in-out
                4.5s infinite;
        }

        @keyframes dibujarCorazon {

            0% {
                stroke-dashoffset: 520;

                opacity: 0;
            }

            12% {
                opacity: 1;
            }

            100% {
                stroke-dashoffset: 0;

                opacity: 1;
            }
        }

        @keyframes brilloCorazon {

            0%,
            100% {
                stroke:
                    rgba(
                        255,
                        220,
                        110,
                        .90
                    );

                filter:
                    drop-shadow(
                        0 0 5px
                        rgba(
                            255,
                            213,
                            79,
                            .35
                        )
                    );
            }

            50% {
                stroke:
                    rgba(
                        255,
                        248,
                        205,
                        1
                    );

                filter:
                    drop-shadow(
                        0 0 15px
                        rgba(
                            255,
                            213,
                            79,
                            .85
                        )
                    );
            }
        }


        /* =======================================
           TEXTO
        ======================================= */

        .titulo-romantico {
            margin:
                0 auto
                12px;

            font-family:
                'Pacifico',
                cursive;

            color: white;

            font-size:
                clamp(
                    2rem,
                    5vw,
                    3rem
                );

            line-height: 1.35;

            text-shadow:
                0 4px 10px
                rgba(0,0,0,.8),

                0 0 25px
                rgba(0,0,0,.5);
        }

        .subtitulo {
            max-width: 440px;

            margin:
                0 auto
                24px;

            color:
                rgba(255,255,255,.96);

            font-size: 1.08rem;

            font-weight: 500;

            line-height: 1.6;

            text-shadow:
                0 3px 7px
                rgba(0,0,0,.85);
        }


        /* =======================================
           BOTONES
        ======================================= */

        .contenedor-botones {
            min-height: 68px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 14px;

            flex-wrap: wrap;
        }

        .btn-romantico {
            min-width: 135px;

            padding:
                11px
                25px;

            border: none;

            border-radius: 15px;

            font-family:
                'Fredoka',
                sans-serif;

            font-size: 1.05rem;

            font-weight: 600;

            box-shadow:
                0 9px 22px
                rgba(0,0,0,.30);

            transition:
                transform .25s ease,
                box-shadow .25s ease,
                background-color .25s ease;
        }

        .btn-si {
            position: relative;

            overflow: visible;

            color: #5d4037;

            background:
                linear-gradient(
                    135deg,
                    #ffe477,
                    #ffc107
                );

            transform-origin:
                center;
        }

        .btn-si:hover {
            transform:
                translateY(-4px)
                scale(1.06);

            box-shadow:
                0 14px 30px
                rgba(255,193,7,.43);
        }

        .btn-no {
            color: #666;

            background:
                rgba(255,255,255,.95);
        }

        .btn-no:hover {
            background:
                white;
        }


        /* =======================================
           BOTÓN SÍ REACCIONANDO
        ======================================= */

        .btn-si.reaccionando {

            animation:
                reaccionBtnSi
                .65s ease;
        }

        @keyframes reaccionBtnSi {

            0% {
                transform:
                    scale(1);
            }

            25% {
                transform:
                    scale(1.15)
                    rotate(-2deg);
            }

            50% {
                transform:
                    scale(1.08)
                    rotate(2deg);
            }

            75% {
                transform:
                    scale(1.12)
                    rotate(-1deg);
            }

            100% {
                transform:
                    scale(1);
            }
        }


        /* =======================================
           MINI CORAZONES
        ======================================= */

        .mini-corazon {
            position: fixed;

            z-index: 99999;

            pointer-events: none;

            font-size: 1.05rem;

            filter:
                drop-shadow(
                    0 2px 5px
                    rgba(0,0,0,.25)
                );

            animation:
                subirCorazon
                1.3s ease-out
                forwards;
        }

        @keyframes subirCorazon {

            0% {
                opacity: 0;

                transform:
                    translateY(10px)
                    scale(.65);
            }

            20% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

            100% {
                opacity: 0;

                transform:
                    translateY(-55px)
                    translateX(
                        var(--desvioX)
                    )
                    scale(1.2);
            }
        }


        /* =======================================
           PÉTALOS
        ======================================= */

        #petalos {
            position: fixed;

            inset: 0;

            z-index: 50;

            overflow: hidden;

            pointer-events: none;
        }

        .petalo {
            position: absolute;

            top: -80px;

            opacity: 0;

            object-fit: contain;

            pointer-events: none;

            animation:
                caerPetalo
                linear forwards;
        }

        @keyframes caerPetalo {

            0% {
                opacity: 0;

                transform:
                    translate3d(
                        0,
                        -80px,
                        0
                    )
                    rotate(0deg);
            }

            10% {
                opacity: .9;
            }

            50% {
                transform:
                    translate3d(
                        var(--movX),
                        50vh,
                        0
                    )
                    rotate(180deg);
            }

            100% {
                opacity: 0;

                transform:
                    translate3d(
                        calc(
                            var(--movX) * -.5
                        ),
                        110vh,
                        0
                    )
                    rotate(480deg);
            }
        }


        /* =======================================
           PARTÍCULAS DORADAS
        ======================================= */

        .particula {
            position: fixed;

            z-index: 5;

            pointer-events: none;

            border-radius: 50%;

            background:
                #ffe77a;

            box-shadow:
                0 0 12px
                #ffd54f;

            animation:
                particulaFlota
                linear forwards;
        }

        @keyframes particulaFlota {

            0% {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(.5);
            }

            30% {
                opacity: 1;
            }

            100% {
                opacity: 0;

                transform:
                    translateY(-105px)
                    translateX(
                        var(--mov)
                    )
                    scale(1.4);
            }
        }


        /* =======================================
           FRASES FLOTANTES
        ======================================= */

        #frasesFlotantes {
            position: fixed;

            inset: 0;

            z-index: 45;

            overflow: hidden;

            pointer-events: none;
        }

        .frase-flotante {
            position: absolute;

            transform:
                translate(
                    -50%,
                    -50%
                );

            max-width:
                min(
                    90vw,
                    420px
                );

            padding:
                8px
                14px;

            border-radius: 18px;

            white-space: nowrap;

            font-family:
                'Pacifico',
                cursive;

            font-size:
                clamp(
                    .95rem,
                    2.2vw,
                    1.4rem
                );

            color:
                rgba(
                    255,
                    255,
                    255,
                    .97
                );

            text-shadow:
                0 3px 10px
                rgba(0,0,0,.72),

                0 0 18px
                rgba(
                    255,
                    213,
                    79,
                    .28
                );

            background:
                rgba(
                    255,
                    255,
                    255,
                    .04
                );

            backdrop-filter:
                blur(2px);

            opacity: 0;

            animation:
                flotarFrase
                5.5s
                ease-in-out
                forwards;
        }

        @keyframes flotarFrase {

            0% {
                opacity: 0;

                transform:
                    translate(
                        -50%,
                        15px
                    )
                    scale(.90);

                filter:
                    blur(6px);
            }

            15% {
                opacity: 1;

                transform:
                    translate(
                        -50%,
                        0
                    )
                    scale(1);

                filter:
                    blur(0);
            }

            70% {
                opacity: 1;

                transform:
                    translate(
                        -50%,
                        -18px
                    )
                    scale(1.02);
            }

            100% {
                opacity: 0;

                transform:
                    translate(
                        -50%,
                        -45px
                    )
                    scale(.96);

                filter:
                    blur(4px);
            }
        }


        /* =======================================
           CONTROL DE MÚSICA
        ======================================= */

        .btn-musica {
            position: fixed;

            right: 18px;
            bottom: 18px;

            width: 48px;
            height: 48px;

            z-index: 1000;

            border: none;

            border-radius: 50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .93
                );

            box-shadow:
                0 8px 25px
                rgba(
                    0,
                    0,
                    0,
                    .3
                );

            opacity: 0;

            transform:
                translateY(15px)
                scale(.8);

            pointer-events: none;

            transition:
                opacity .5s ease,
                transform .5s ease;
        }

        body.escena-activa
        .btn-musica {

            opacity: 1;

            transform:
                translateY(0)
                scale(1);

            pointer-events: auto;
        }

        .btn-musica:hover {

            transform:
                scale(1.08);
        }


        /* =======================================
           RESPONSIVE
        ======================================= */

        @media
        (max-height: 760px) {

            main {
                padding:
                    14px
                    10px;
            }

            .video-contenedor {
                width:
                    min(
                        220px,
                        58vw
                    );

                margin:
                    10px auto
                    14px;
            }

            .titulo-romantico {
                font-size:
                    1.85rem;
            }

            .subtitulo {
                margin-bottom:
                    14px;
            }

            .corazon-svg {
                inset:
                    -35px;
            }
        }


        @media
        (max-width: 430px) {

            main {
                padding:
                    15px
                    10px;
            }

            .video-contenedor {
                width:
                    min(
                        250px,
                        72vw
                    );
            }

            .titulo-romantico {
                font-size:
                    2rem;
            }

            .subtitulo {
                font-size:
                    .98rem;
            }

            .insignia-fecha {
                padding:
                    9px
                    13px;

                font-size:
                    .64rem;

                letter-spacing:
                    .6px;
            }

            .frase-flotante {
                max-width:
                    85vw;

                white-space:
                    normal;

                text-align:
                    center;
            }

            .corazon-svg {
                inset:
                    -35px;
            }
        }


        @media
        (max-width: 350px) {

            .contenedor-botones {
                flex-direction:
                    column;
            }

            .btn-si,
            .btn-no {
                width: 100%;

                max-width: 230px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================
         FONDO
    ========================================== -->

    <div class="fondo-zoom"></div>

    <div class="ambiente"></div>

    <div class="luz-central"></div>


    <!-- =========================================
         PÉTALOS
    ========================================== -->

    <div id="petalos"></div>


    <!-- =========================================
         FRASES FLOTANTES
    ========================================== -->

    <div id="frasesFlotantes"></div>


    <!-- =========================================
         CORTINAS
    ========================================== -->

    <div class="escenario-cortinas">

        <div
            class="
                cortina
                cortina-izquierda
            "
        ></div>

        <div
            class="
                cortina
                cortina-derecha
            "
        ></div>

    </div>


    <div class="cenefa"></div>


    <!-- =========================================
         PANTALLA INICIAL
    ========================================== -->

    <div
        class="overlay-inicio"
        id="overlayInicio"
    >

        <div class="tarjeta-inicio">

            <div class="flor-inicio">
                🌻
            </div>

            <h2 class="titulo-inicio">
                ¡Hola! 💛
            </h2>

            <p class="texto-inicio">
                Tengo una pequeña sorpresa
                preparada especialmente
                para ti.
            </p>

            <button
                id="btnEntrar"
                class="
                    btn-abrir
                    w-100
                "
                type="button"
            >
                Abrir sorpresa ✨
            </button>

        </div>

    </div>


    <!-- =========================================
         AUDIO
    ========================================== -->

    <audio
        id="musica"
        loop
        preload="auto"
    >

        <source
            src="musica/flores.mp3"
            type="audio/mpeg"
        >

    </audio>


    <button
        id="btnMusica"
        class="btn-musica"
        type="button"
        title="Música"
        aria-label="Activar o desactivar música"
    >
        🔊
    </button>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main>

        <div class="contenido-principal">


            <!-- FECHA -->

            <div
                class="
                    animar
                    delay-1
                "
            >

                <span
                    class="insignia-fecha"
                >

                    🌻

                    <span>
                        21 DE SEPTIEMBRE
                        •
                        FLORES AMARILLAS
                    </span>

                </span>

            </div>


            <!-- VIDEO -->

            <div
                class="
                    video-contenedor
                    animar
                    delay-2
                "
            >


                <!-- CORAZÓN -->

                <div
                    class="corazon-svg"
                >

                    <svg
                        viewBox="0 0 200 200"
                        class="corazon-linea"
                    >

                        <path
                            class="corazon-trazo"
                            d="
                                M100,175

                                C100,175
                                25,125
                                25,75

                                C25,45
                                45,25
                                70,25

                                C88,25
                                98,38
                                100,45

                                C102,38
                                112,25
                                130,25

                                C155,25
                                175,45
                                175,75

                                C175,125
                                100,175
                                100,175
                                Z
                            "
                        />

                    </svg>

                </div>


                <!-- VIDEO -->

                <video
                    class="video-principal"
                    autoplay
                    loop
                    muted
                    playsinline
                    preload="metadata"
                >

                    <source
                        src="video/chico.mp4"
                        type="video/mp4"
                    >

                    Tu navegador no soporta video HTML5.

                </video>

            </div>


            <!-- TÍTULO -->

            <h1
                class="
                    titulo-romantico
                    animar
                    delay-3
                "
            >

                ¿Quieres ser mi
                21 de septiembre?
                🌻

            </h1>


            <!-- FRASE -->

            <p
                class="
                    subtitulo
                    animar
                    delay-4
                "
            >

                Tengo un detalle especial
                preparado solo para ti...
                ✨

            </p>


            <!-- BOTONES -->

            <div
                class="
                    contenedor-botones
                    animar
                    delay-5
                "
            >

                <button
                    id="btnSi"
                    class="
                        btn-romantico
                        btn-si
                    "
                    type="button"
                >
                    Sí 💛
                </button>


                <button
                    id="btnNo"
                    class="
                        btn-romantico
                        btn-no
                    "
                    type="button"
                >
                    No 💔
                </button>

            </div>


        </div>

    </main>


    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script>

        /* =====================================
           ELEMENTOS
        ===================================== */

        const body =
            document.body;


        const btnEntrar =
            document.getElementById(
                'btnEntrar'
            );


        const btnSi =
            document.getElementById(
                'btnSi'
            );


        const btnNo =
            document.getElementById(
                'btnNo'
            );


        const musica =
            document.getElementById(
                'musica'
            );


        const btnMusica =
            document.getElementById(
                'btnMusica'
            );


        const petalos =
            document.getElementById(
                'petalos'
            );


        const frasesFlotantes =
            document.getElementById(
                'frasesFlotantes'
            );


        let musicaActiva =
            false;


        let petalosInterval;


        let frasesInterval;


        let intentosNo =
            0;


        /* =====================================
           ABRIR SORPRESA
        ===================================== */

        btnEntrar.addEventListener(
            'click',
            async () => {


                /* ---------------------------
                   MÚSICA
                ---------------------------- */

                try {

                    musica.volume =
                        0.50;


                    await musica.play();


                    musicaActiva =
                        true;


                    btnMusica.textContent =
                        '🔊';

                }

                catch(error) {

                    musicaActiva =
                        false;


                    btnMusica.textContent =
                        '🔇';


                    console.log(
                        'Audio bloqueado:',
                        error
                    );

                }


                /* ---------------------------
                   ABRIR CORTINAS
                ---------------------------- */

                body.classList.add(
                    'abrir'
                );


                /* ---------------------------
                   ACTIVAR ESCENA
                ---------------------------- */

                setTimeout(
                    () => {

                        body.classList.add(
                            'escena-activa'
                        );


                        iniciarPetalos();


                        iniciarParticulas();


                        iniciarFrasesFlotantes();

                    },
                    900
                );


                /* ---------------------------
                   ELIMINAR CORTINAS
                ---------------------------- */

                setTimeout(
                    () => {

                        const escenario =
                            document.querySelector(
                                '.escenario-cortinas'
                            );


                        const cenefa =
                            document.querySelector(
                                '.cenefa'
                            );


                        const overlay =
                            document.getElementById(
                                'overlayInicio'
                            );


                        if (escenario) {

                            escenario.remove();

                        }


                        if (cenefa) {

                            cenefa.remove();

                        }


                        if (overlay) {

                            overlay.remove();

                        }

                    },
                    3600
                );

            }
        );


        /* =====================================
           CONTROL DE MÚSICA
        ===================================== */

        btnMusica.addEventListener(
            'click',
            async () => {

                if (
                    musicaActiva
                ) {

                    musica.pause();


                    musicaActiva =
                        false;


                    btnMusica.textContent =
                        '🔇';

                }

                else {

                    try {

                        await musica.play();


                        musicaActiva =
                            true;


                        btnMusica.textContent =
                            '🔊';

                    }

                    catch(error) {

                        console.log(
                            error
                        );

                    }

                }

            }
        );


        /* =====================================
           PÉTALOS
        ===================================== */

        function crearPetalo() {

            const petalo =
                document.createElement(
                    'img'
                );


            petalo.src =
                'img/petalo.png';


            petalo.classList.add(
                'petalo'
            );


            const size =
                Math.random() *
                24 +
                18;


            petalo.style.width =
                `${size}px`;


            petalo.style.height =
                `${size}px`;


            petalo.style.left =
                `${Math.random() * 100}vw`;


            const movimiento =
                Math.random() *
                180 -
                90;


            petalo.style.setProperty(
                '--movX',
                `${movimiento}px`
            );


            const duracion =
                Math.random() *
                5 +
                6;


            petalo.style.animationDuration =
                `${duracion}s`;


            petalos.appendChild(
                petalo
            );


            setTimeout(
                () => {

                    petalo.remove();

                },
                duracion * 1000
            );

        }


        function iniciarPetalos() {

            /*
                Primera lluvia
            */

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                setTimeout(
                    crearPetalo,
                    i * 130
                );

            }


            /*
                Lluvia continua
            */

            petalosInterval =
                setInterval(
                    crearPetalo,
                    430
                );

        }


        /* =====================================
           PARTÍCULAS DORADAS
        ===================================== */

        function crearParticula() {

            if (
                !body.classList.contains(
                    'escena-activa'
                )
            ) {

                return;

            }


            const particula =
                document.createElement(
                    'span'
                );


            particula.classList.add(
                'particula'
            );


            const tamano =
                Math.random() *
                3.5 +
                2;


            particula.style.width =
                `${tamano}px`;


            particula.style.height =
                `${tamano}px`;


            particula.style.left =
                `${Math.random() * 100}vw`;


            particula.style.top =
                `${
                    20 +
                    Math.random() *
                    80
                }vh`;


            particula.style.setProperty(
                '--mov',
                `${
                    Math.random() *
                    50 -
                    25
                }px`
            );


            const duracion =
                Math.random() *
                3 +
                3;


            particula.style.animationDuration =
                `${duracion}s`;


            document.body.appendChild(
                particula
            );


            setTimeout(
                () => {

                    particula.remove();

                },
                duracion * 1000
            );

        }


        function iniciarParticulas() {

            setInterval(
                crearParticula,
                500
            );

        }


        /* =====================================
           FRASES FLOTANTES
        ===================================== */

        const frasesRomanticas = [

            'Esto es para ti 🌻',

            'Pensé en ti hoy 💛',

            'Quería sacarte una sonrisa ✨',

            'Espero que te guste 🥹',

            'Un pequeño detalle para ti 🌼',

            'Hoy las flores son para ti 💛',

            'Solo quería verte sonreír ✨',

            'Algo pequeño para alguien especial 🌻'

        ];


        let ultimaFrase =
            -1;


        function crearFraseFlotante() {

            if (
                !body.classList.contains(
                    'escena-activa'
                )
            ) {

                return;

            }


            /*
                Evita repetir inmediatamente
                la misma frase
            */

            let indice;


            do {

                indice =
                    Math.floor(
                        Math.random() *
                        frasesRomanticas.length
                    );

            }

            while (
                indice === ultimaFrase &&
                frasesRomanticas.length > 1
            );


            ultimaFrase =
                indice;


            const frase =
                document.createElement(
                    'div'
                );


            frase.classList.add(
                'frase-flotante'
            );


            frase.textContent =
                frasesRomanticas[
                    indice
                ];


            /*
                Intentamos mantenerlas
                alrededor del personaje,
                sin cubrir demasiado
                el centro.
            */

            const posiciones = [

                {
                    left: 18,
                    top: 35
                },

                {
                    left: 82,
                    top: 38
                },

                {
                    left: 18,
                    top: 65
                },

                {
                    left: 82,
                    top: 67
                },

                {
                    left: 50,
                    top: 18
                }

            ];


            const posicion =
                posiciones[
                    Math.floor(
                        Math.random() *
                        posiciones.length
                    )
                ];


            frase.style.left =
                `${posicion.left}%`;


            frase.style.top =
                `${posicion.top}%`;


            frasesFlotantes.appendChild(
                frase
            );


            setTimeout(
                () => {

                    frase.remove();

                },
                5500
            );

        }


        function iniciarFrasesFlotantes() {

            /*
                Primera frase
            */

            setTimeout(
                crearFraseFlotante,
                2400
            );


            /*
                Frases siguientes
            */

            frasesInterval =
                setInterval(
                    crearFraseFlotante,
                    4700
                );

        }


        /* =====================================
           MINI CORAZONES
        ===================================== */

        function crearMiniCorazon(
            x,
            y
        ) {

            const corazon =
                document.createElement(
                    'span'
                );


            corazon.classList.add(
                'mini-corazon'
            );


            const corazones = [

                '💛',
                '💖',
                '✨',
                '🌻'

            ];


            corazon.textContent =
                corazones[
                    Math.floor(
                        Math.random() *
                        corazones.length
                    )
                ];


            corazon.style.left =
                `${x}px`;


            corazon.style.top =
                `${y}px`;


            corazon.style.setProperty(
                '--desvioX',
                `${
                    Math.random() *
                    50 -
                    25
                }px`
            );


            document.body.appendChild(
                corazon
            );


            setTimeout(
                () => {

                    corazon.remove();

                },
                1300
            );

        }


        /* =====================================
           BOTÓN SÍ REACCIONA
        ===================================== */

        function reaccionarBotonSi() {

            /*
                Reinicia animación
            */

            btnSi.classList.remove(
                'reaccionando'
            );


            void btnSi.offsetWidth;


            btnSi.classList.add(
                'reaccionando'
            );


            /*
                Posición del botón
            */

            const rect =
                btnSi.getBoundingClientRect();


            /*
                Corazones
            */

            for (
                let i = 0;
                i < 6;
                i++
            ) {

                const x =
                    rect.left +
                    rect.width / 2 +
                    (
                        Math.random() *
                        35 -
                        17
                    );


                const y =
                    rect.top +
                    rect.height / 2;


                setTimeout(
                    () => {

                        crearMiniCorazon(
                            x,
                            y
                        );

                    },
                    i * 90
                );

            }

        }


        /*
            Reacciona cuando pasan
            el mouse por encima
        */

        btnSi.addEventListener(
            'mouseenter',
            reaccionarBotonSi
        );


        /*
            Celular
        */

        btnSi.addEventListener(
            'touchstart',
            reaccionarBotonSi,
            {
                passive: true
            }
        );


        /* =====================================
           BOTÓN NO
        ===================================== */

        const frasesNo = [

            '¿Segura? 🥺',

            'Piénsalo bien 😭',

            '¡Casi! 😂',

            'No seas mala 😔',

            'Atrápame 😌',

            '¿En serio? 🥹',

            'Otra oportunidad 😏',

            'Ese botón no sirve 😂',

            'Presiona el amarillo 💛'

        ];


        function moverNo() {

            intentosNo++;


            /*
                Cambiar frase
            */

            const frase =
                frasesNo[
                    Math.floor(
                        Math.random() *
                        frasesNo.length
                    )
                ];


            btnNo.textContent =
                frase;


            /*
                Posición fija
            */

            btnNo.style.position =
                'fixed';


            btnNo.style.zIndex =
                '3000';


            const margen =
                20;


            const maxX =
                window.innerWidth -
                btnNo.offsetWidth -
                margen;


            const maxY =
                window.innerHeight -
                btnNo.offsetHeight -
                margen;


            const x =
                Math.max(
                    margen,
                    Math.random() *
                    maxX
                );


            const y =
                Math.max(
                    margen,
                    Math.random() *
                    maxY
                );


            btnNo.style.left =
                `${x}px`;


            btnNo.style.top =
                `${y}px`;


            /*
                El botón Sí reacciona
                cada vez que intenta
                presionar No
            */

            reaccionarBotonSi();


            /*
                Y además crece
                progresivamente
            */

            if (
                intentosNo >= 2
            ) {

                const escala =
                    Math.min(
                        1 +
                        intentosNo *
                        .025,
                        1.18
                    );


                btnSi.style.transform =
                    `scale(${escala})`;

            }

        }


        /*
            PC
        */

        btnNo.addEventListener(
            'mouseenter',
            moverNo
        );


        /*
            Celular
        */

        btnNo.addEventListener(
            'touchstart',
            event => {

                event.preventDefault();


                moverNo();

            },
            {
                passive: false
            }
        );


        /*
            Si alcanza a darle click
        */

        btnNo.addEventListener(
            'click',
            moverNo
        );


        /* =====================================
           BOTÓN SÍ
        ===================================== */

        btnSi.addEventListener(
            'click',
            () => {


                /*
                    Muchos pétalos
                */

                for (
                    let i = 0;
                    i < 50;
                    i++
                ) {

                    setTimeout(
                        crearPetalo,
                        i * 25
                    );

                }


                /*
                    Corazones
                */

                reaccionarBotonSi();


                /*
                    Desvanecer página
                */

                setTimeout(
                    () => {

                        body.style.transition =
                            'opacity .9s ease';


                        body.style.opacity =
                            '0';

                    },
                    500
                );


                /*
                    Ir a si.html
                */

                setTimeout(
                    () => {

                        window.location.href =
                            'si.html';

                    },
                    1400
                );

            }
        );


        /* =====================================
           REAJUSTE DE VENTANA
        ===================================== */

        window.addEventListener(
            'resize',
            () => {

                /*
                    Si NO ya estaba moviéndose,
                    lo regresamos a una zona
                    segura.
                */

                if (
                    btnNo.style.position ===
                    'fixed'
                ) {

                    btnNo.style.left =
                        '50%';


                    btnNo.style.top =
                        '85%';


                    btnNo.style.transform =
                        'translate(-50%, -50%)';

                }

            }
        );


    </script>


</body>
</html>
