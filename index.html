<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti...</title>
    <style>
        @import url('[https://fonts.googleapis.com/css2?family=Sacramento&display=swap](https://fonts.googleapis.com/css2?family=Sacramento&display=swap)');

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
            background-image: url('img/fondo8.png'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            
            font-family: 'Sacramento', cursive;
            text-align: center;
            overflow: hidden; 
            position: relative;
        }

        /* Efecto de cortinas de teatro con pliegues realistas */
        .cortina {
            position: fixed;
            top: 0;
            width: 50%;
            height: 100%;
            /* Simula el telón de tela con textura y pliegues oscuros y claros */
            background: linear-gradient(90deg, #5c061c 0%, #880e2b 20%, #b71c3f 50%, #880e2b 80%, #5c061c 100%);
            background-size: 60px 100%;
            z-index: 9998;
            /* Transición más lenta (2 segundos) con efecto suave al final */
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        .cortina-izquierda {
            left: 0;
            transform-origin: left;
        }

        .cortina-derecha {
            right: 0;
            transform-origin: right;
        }

        /* Tarjeta de bienvenida en el centro */
        .tarjeta-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 90%;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        /* Activadores de apertura lenta de la cortina */
        body.abrir .cortina-izquierda {
            transform: translateX(-100%);
        }

        body.abrir .cortina-derecha {
            transform: translateX(100%);
        }

        body.abrir .tarjeta-overlay {
            opacity: 0;
            pointer-events: none;
        }

        .tarjeta-overlay h2 {
            font-family: 'Pacifico', cursive;
            color: #d81b60;
            margin-top: 0;
            font-size: 26px;
        }

        .tarjeta-overlay p {
            color: #555;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .btn-entrar {
            background-color: #ffd54f;
            color: #5d4037;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-family: 'Fredoka', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-entrar:hover {
            background-color: #ffc107;
            transform: scale(1.05);
        }

        .contenedor {
            background-color: transparent;
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 400px;
            width: 90%; 
            box-sizing: border-box;
            position: relative;
            z-index: 10; 
        }

        .video-principal {
            width: 100%;
            height: auto;
            border-radius: 15px; 
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            object-fit: cover; 
        }

        h1 {
            color: #ffffff;
            font-family: 'Pacifico', cursive;
            font-size: 28px;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0px 0px 15px rgba(0,0,0,0.8);
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 15px; 
            flex-wrap: wrap; 
        }

        button {
            padding: 12px 25px;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            width: 120px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .btn-si {
            background-color: #ffd54f; 
            color: #5d4037; 
        }

        .btn-si:hover {
            background-color: #ffc107;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: #f5f5f5; 
            color: #666;
            border: 1px solid #ddd;
            transition: all 0.2s ease; 
        }

        @media (max-width: 350px) {
            button {
                width: 100%; 
            }
        }

        .petalo {
            position: absolute;
            top: -20%; 
            z-index: 1; 
            opacity: 0.9;
            animation: caer linear infinite; 
            object-fit: contain; 
        }

        @keyframes caer {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body>

    <!-- Cortinas de teatro con textura de pliegues -->
    <div class="cortina cortina-izquierda"></div>
    <div class="cortina cortina-derecha"></div>

    <!-- Caja de bienvenida central -->
    <div class="tarjeta-overlay" id="tarjetaOverlay">
        <h2>¡Hola! 🌻</h2>
        <p>Tienes una pequeña sorpresa esperándote.</p>
        <button class="btn-entrar" id="btnEntrar">Abrir sorpresa 💛</button>
    </div>

    <audio id="musicaFondo" loop>
        <source src="musica/flores.mp3" type="audio/mp3">
    </audio>

    <div class="contenedor">
        <video class="video-principal" autoplay loop muted playsinline>
            <source src="video/chico.mp4" type="video/mp4">
            Tu navegador no soporta el formato de video.
        </video>
        
        <h1>¿Quieres ser mi 21 de septiembre? 🌻</h1>
        
        <div class="botones">
            <button class="btn-si" onclick="window.location.href='si.html'">Sí 💛</button>
            <button id="btn-no" class="btn-no">No 💔</button>
        </div>
    </div>

    <script>
        function crearPetalos() {
            const cantidadPetalos = 70; 

            for (let i = 0; i < cantidadPetalos; i++) {
                let petalo = document.createElement('img');
                
                petalo.src = 'img/petalo.png'; 
                petalo.classList.add('petalo');

                let size = Math.random() * 40 + 35; 
                petalo.style.width = `${size}px`;
                petalo.style.height = `${size}px`;

                petalo.style.left = `${Math.random() * 100}vw`;

                let duracion = Math.random() * 4 + 4; 
                petalo.style.animationDuration = `${duracion}s`;

                let retraso = Math.random() * 10;
                petalo.style.animationDelay = `${retraso}s`;

                document.body.appendChild(petalo);
            }
        }

        // === CONTROL DE LA CORTINA Y AUDIO ===
        const btnEntrar = document.getElementById('btnEntrar');
        const musica = document.getElementById('musicaFondo');

        btnEntrar.addEventListener('click', function() {
            // Reproducimos la música sin bloqueos
            musica.play().catch(error => {
                console.log("Error al reproducir audio:", error);
            });

            // Agregamos la clase que abre las cortinas con movimiento lento y teatral
            document.body.classList.add('abrir');

            // Lanzamos los pétalos
            crearPetalos();

            // Eliminamos las cortinas del DOM una vez que termina la animación de apertura (2 segundos)
            setTimeout(() => {
                document.querySelector('.cortina-izquierda').remove();
                document.querySelector('.cortina-derecha').remove();
                document.getElementById('tarjetaOverlay').remove();
            }, 2000);
        });

        // === CÓDIGO DEL BOTÓN ESCURRIDIZO ===
        const btnNo = document.getElementById('btn-no');

        function moverBoton() {
            btnNo.style.position = 'fixed';
            
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            
            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);
            
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        }

        btnNo.addEventListener('mouseover', moverBoton);
        
        btnNo.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            moverBoton();
        });
    </script>

</body>
</html>
